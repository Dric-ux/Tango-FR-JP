<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Tango : vocabulaire français japonais</title>

<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f2430; --muted:#656b78; --line:#e7e0d4;
  --accent:#c8402f; --accent-ink:#ffffff; --accent-soft:#f8e4df;
  --again:#c8402f; --hard:#b9731a; --good:#2f7d4f; --easy:#2d6aa8;
  --shadow:0 6px 24px rgba(31,36,48,.08);
  --jpfont:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161b; --card:#1e2128; --ink:#eceef2; --muted:#9aa1ae; --line:#2e323c;
    --accent:#e0614f; --accent-ink:#1a0d0a; --accent-soft:#3a2420;
    --again:#e0614f; --hard:#d49040; --good:#4fae78; --easy:#5a9ad8;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:15px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
p{margin:0 0 10px}
.jp,.jp-title,.i-jp{font-family:var(--jpfont)}
.jp-title{color:var(--accent);font-weight:500;margin-left:6px}
.ja{font-family:var(--jpfont);font-weight:400;opacity:.8;margin-right:.45em;font-size:.92em}
.rate .ja,button.primary .ja,.sec .ja{display:block;margin:0 0 1px;font-size:.8em}
.hint .ja{display:block;margin:0 0 6px;opacity:1}
.warn{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.warn ul{margin:6px 0 0;padding-left:18px}
#banner{background:#fff3cd;color:#5c4400;padding:8px 14px;font-size:13px;text-align:center}
@media (prefers-color-scheme:dark){#banner{background:#4a3a0a;color:#ffe9a8}}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:26px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px}
textarea{resize:vertical;min-height:110px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 4px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
button.primary{width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:15px;font-weight:700;font-size:17px;cursor:pointer;margin-top:14px}
button.primary:active{filter:brightness(.92)}
button.primary[disabled]{opacity:.45}
.sec{display:block;text-align:center;text-decoration:none;color:var(--ink);width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;font-weight:600;cursor:pointer;margin-top:10px}
button.danger{border-color:var(--again);color:var(--again)}
button.link{background:none;border:0;color:var(--accent);padding:12px;width:100%;cursor:pointer;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.chips span,.tag{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.themes button small{color:var(--muted);margin-left:4px}
.themes button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.themes button.on small{color:inherit;opacity:.85}
.pic,.i-pic{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.pic{font-size:64px;line-height:1.15;margin:0 0 6px}
.i-pic{font-size:30px;line-height:1;flex:0 0 auto}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.item{display:flex;gap:10px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.i-text{flex:1;min-width:0;display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.i-act{display:flex;flex-direction:column;gap:6px}
.i-act button{background:var(--accent-soft);border:0;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.i-main{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.i-fr{font-weight:650}
.i-jp{font-size:18px;text-align:right;flex:0 0 auto;max-width:55%;overflow-wrap:anywhere}
.i-fr{min-width:0;overflow-wrap:anywhere}
.i-sub{font-size:12px;color:var(--muted);margin-top:3px}
.hint{font-size:13px;color:var(--muted)}
.count{font-size:13px;color:var(--muted);margin:8px 2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}
.switch input{width:auto;min-height:0;transform:scale(1.4)}
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span:first-child{font-size:22px;line-height:1}
#nav .ja{display:block;margin:0;font-size:11px;opacity:.9}
#nav button.on{color:var(--accent);font-weight:700}
/* Révision plein écran */
#study{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#study[hidden]{display:none}
.s-top{display:flex;align-items:center;gap:12px;padding:12px 14px}
.s-top button{background:none;border:0;font-size:24px;cursor:pointer;padding:4px 8px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .25s}
.s-rem{font-size:13px;color:var(--muted);min-width:56px;text-align:right}
.s-body{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 16px;overflow:auto}
.s-card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px;text-align:center;cursor:pointer;min-height:240px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.s-card>*{max-width:100%}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.fr-big{font-size:30px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.s-card .jp{font-size:clamp(36px,12vw,52px);line-height:1.25;overflow-wrap:anywhere}
.reading{font-family:var(--jpfont);font-size:22px;color:var(--accent);margin-top:4px}
.romaji{font-size:18px;color:var(--muted);margin-top:2px}
.note{margin-top:12px;font-size:14px;color:var(--muted);font-style:italic}
.s-card hr{border:0;border-top:1px dashed var(--line);margin:18px 0;width:100%}
.speak{margin-top:10px;background:var(--accent-soft);border:0;border-radius:999px;width:46px;height:46px;font-size:20px;cursor:pointer}
.s-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:2px solid;border-radius:14px;background:var(--card);padding:10px 2px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.rate b{font-size:14px}
.rate small{font-size:12px;color:var(--muted)}
.rate.again{border-color:var(--again)}.rate.hard{border-color:var(--hard)}.rate.good{border-color:var(--good)}.rate.easy{border-color:var(--easy)}
.end{text-align:center;padding:20px}
.end .big{font-size:56px}
/* Fenêtres */
#modal{position:fixed;inset:0;background:rgba(10,12,16,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92dvh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

</nav>

<div id="modal" hidden></div>

<script>
(() => {
'use strict';

/* ---------- Constantes ---------- */
const TYPES = ['nom','verbe','adjectif','adverbe','expression','autre'];

  'vetements': '服', 'couleurs': '色', 'nombres': '数字', 'chiffres': '数字', 'temps': '時間', 'meteo': '天気', 'salutations': 'あいさつ',
  'animaux': '動物', 'nature': '自然', 'travail': '仕事', 'metiers': '職業', 'ecole': '学校', 'etudes': '勉強', 'sante': '健康', 'loisirs': '趣味',
  'sport': 'スポーツ', 'musique': '音楽', 'argent': 'お金', 'emotions': '感情', 'sentiments': '気持ち', 'verbes': '動詞', 'verbes courants': 'よく使う動詞',
  'adjectifs': '形容詞', 'adjectifs de base': '基本の形容詞', 'adverbes': '副詞', 'expressions': '表現', 'restaurant': 'レストラン', 'courses': '買い物',
  'shopping': '買い物', 'hotel': 'ホテル', 'directions': '道案内', 'lieux': '場所', 'objets': '物', 'pays': '国', 'jours': '曜日', 'mois': '月',
  'calendrier': 'カレンダー', 'heure': '時刻', 'technologie': '技術', 'internet': 'インターネット', 'culture': '文化', 'quotidien': '日常',
  'vie quotidienne': '日常生活', 'conversation': '会話', 'questions': '質問', 'phrases utiles': '便利なフレーズ', 'divers': 'その他', 'autre': 'その他', 'sans theme': 'テーマなし'
};

const STARTER = [
  ['Bonjour','こんにちは','','Salutations','expression'],
  ['Bonsoir','こんばんは','','Salutations','expression'],
  ['Bonjour (le matin)','おはよう','','Salutations','expression'],

  ['Non','いいえ','','Salutations','expression'],
  ['eau','水','みず','Nourriture','nom'],
  ['riz cuit, repas','ご飯','ごはん','Nourriture','nom'],
  ['pain','パン','','Nourriture','nom'],
  ['poisson','魚','さかな','Nourriture','nom'],
  ['viande','肉','にく','Nourriture','nom'],
  ['thé','お茶','おちゃ','Nourriture','nom'],
  ['pomme','りんご','','Nourriture','nom'],
  ['un','一','いち','Nombres','autre'],
  ['deux','二','に','Nombres','autre'],
  ['trois','三','さん','Nombres','autre'],
  ['quatre','四','よん','Nombres','autre'],
  ['cinq','五','ご','Nombres','autre'],
  ['manger','食べる','たべる','Verbes courants','verbe'],
  ['boire','飲む','のむ','Verbes courants','verbe'],
  ['aller','行く','いく','Verbes courants','verbe'],
  ['venir','来る','くる','Verbes courants','verbe'],
  ['voir, regarder','見る','みる','Verbes courants','verbe'],
  ['faire','する','','Verbes courants','verbe'],
  ['grand','大きい','おおきい','Adjectifs de base','adjectif'],
  ['petit','小さい','ちいさい','Adjectifs de base','adjectif'],
  ['délicieux, bon (au goût)','おいしい','','Adjectifs de base','adjectif'],
  ['nouveau','新しい','あたらしい','Adjectifs de base','adjectif'],
  ['très','とても','','Adverbes','adverbe'],
  ['un peu','少し','すこし','Adverbes','adverbe'],
  ['beaucoup','たくさん','','Adverbes','adverbe']
];

/* ---------- Utilitaires ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ja = (t) => `<span class="ja">${t}</span>`;
const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
const num = (v, d) => { v = Number(v); return Number.isFinite(v) ? v : d; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const endOfToday = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); };
let isPreview = false;
try { isPreview = window.self !== window.top; } catch (e) { isPreview = true; }

/* ---------- Romaji (hiragana et katakana vers lettres latines) ---------- */
const BASE = {
 'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
 'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
 'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
 'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
 'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'wo','ん':'n',
 'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
 'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
 'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ゔ':'vu',
 'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'
};
const SMALL_Y = {'ゃ':'a','ゅ':'u','ょ':'o'};
const WORD_EXCEPTIONS = {'こんにちは':'konnichiwa','こんばんは':'konbanwa'};
const toHira = (s) => s.replace(/[ァ-ヶ]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0x60));
const isKana = (s) => /^[ぁ-ゖァ-ヺー\s・]+$/.test(s || '');
const isLatin = (s) => /^[\x20-\x7EÀ-ſ]+$/.test(s || '');
function romaji(src) {
  const s = toHira(String(src).trim());
  if (WORD_EXCEPTIONS[s]) return WORD_EXCEPTIONS[s];
  let out = '', i = 0, sokuon = false, prevN = false;
  while (i < s.length) {
    const ch = s[i];
    if (ch === 'っ') { sokuon = true; i++; continue; }
    if (ch === 'ー') { const m = out.match(/[aiueo]$/); if (m) out += m[0]; i++; continue; }
    if (ch === ' ' || ch === '　' || ch === '・') { out += ' '; i++; prevN = false; continue; }
    let syl = BASE[ch];
    if (syl === undefined) { out += ch; i++; continue; }
    let adv = 1;
    const nx = s[i + 1];
    if (nx && SMALL_Y[nx] && syl.length > 1 && syl.endsWith('i')) {
      const v = SMALL_Y[nx];
      if (syl === 'shi') syl = 'sh' + v; else if (syl === 'chi') syl = 'ch' + v; else if (syl === 'ji') syl = 'j' + v;
      else syl = syl.slice(0, -1) + 'y' + v;
      adv = 2;
    }
    if (prevN && /^[aiueoy]/.test(syl)) out += "'";
    if (sokuon) { syl = (syl.startsWith('ch') ? 't' : syl[0]) + syl; sokuon = false; }
    out += syl; prevN = (syl === 'n'); i += adv;
  }
  return out;
}
const hasKanji = (s) => /[㐀-䶿一-鿿々]/.test(s || '');
function hiraOf(c) {
  if (c.reading && !isLatin(c.reading)) return toHira(c.reading.trim());
  return isKana(c.jp) ? toHira(c.jp.trim()) : '';
}
const needsHira = (jp, reading) => hasKanji(jp) && !(reading && !isLatin(reading));
function kanaLine(c) { const h = hiraOf(c); return h && h !== c.jp.trim() ? h : ''; }
function romajiLine(c) {
  if (!db.settings.romaji) return '';
  if (c.reading) return isLatin(c.reading) ? c.reading : (isKana(c.reading) ? romaji(c.reading) : '');
  return isKana(c.jp) ? romaji(c.jp) : '';
}
function readingLines(c) {
  const k = kanaLine(c), r = romajiLine(c);
  return (k ? `<div class="reading">${esc(k)}</div>` : '') + (r ? `<div class="romaji">${esc(r)}</div>` : '');
}

/* ---------- Données et sauvegarde ---------- */
let storageOK = true;
let EMOJI_RE; try { EMOJI_RE = new RegExp('\\p{Extended_Pictographic}|\\p{Regional_Indicator}', 'u'); } catch (e) { EMOJI_RE = /[^\x00-\x7f]/; }
function cleanImg(v) {
  const t = String(v || '').replace(/\s+/g, '');
  if (!t || !EMOJI_RE.test(t)) return '';
  let parts = [t];
  try { if (window.Intl && Intl.Segmenter) parts = Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(t), (x) => x.segment); } catch (e) {}
  return parts.filter((x) => EMOJI_RE.test(x)).slice(0, 3).join('');
}
const srsNew = () => ({ ease: 2.5, ivl: 0, due: 0, reps: 0, lapses: 0, lrn: false });
function sanitizeCard(c) {
  if (!c || typeof c !== 'object') return null;
  const fr = String(c.fr || '').trim(), jp = String(c.jp || '').trim();
  if (!fr || !jp) return null;
  const clean = (s) => ({ ease: num(s && s.ease, 2.5), ivl: num(s && s.ivl, 0), due: num(s && s.due, 0), reps: num(s && s.reps, 0), lapses: num(s && s.lapses, 0), lrn: !!(s && s.lrn) });
  const srs = c.srs || {};
  return { id: String(c.id || uid()), fr, jp, reading: String(c.reading || '').trim(), theme: String(c.theme || '').trim() || NO_THEME,
    type: TYPES.includes(c.type) ? c.type : 'autre', note: String(c.note || '').trim(), img: cleanImg(c.img), created: num(c.created, Date.now()), srs: { a: clean(srs.a), b: clean(srs.b) } };
}
function defaults() {
  return { v: 1, themeJa: {}, cards: [], settings: { newPerSession: 10, romaji: false, readingFront: true, images: true, imageFront: false }, ui: { themes: [], types: [], dir: 'both', lastTheme: '', lastType: 'nom' } };
}
function loadDB() {
  const d = defaults();
  try {
    localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe');
    const raw = localStorage.getItem(KEY);

function addMany(items) {

/* ---------- Répétition espacée (inspirée d'Anki) ---------- */
const phase = (s) => (s.lrn ? 'lrn' : (s.reps === 0 ? 'new' : 'rev'));
function schedule(s, q, now) {
  const n = Object.assign({}, s);
  const p = phase(s);
  if (p === 'new' || p === 'lrn') {
    if (q === 0) { n.lrn = true; n.due = now + 1 * MIN; }
    else if (q === 1) { n.lrn = true; n.due = now + 6 * MIN; }
    else {
      const g = q === 2 ? (s.ivl > 0 ? s.ivl : 1) : (s.ivl > 0 ? Math.round(s.ivl * 1.5) + 1 : 4);
      n.lrn = false; n.reps = s.reps + 1; n.ivl = g; n.due = now + g * DAY;
    }
  } else if (q === 0) {
    n.lapses = s.lapses + 1; n.ease = Math.max(1.3, s.ease - 0.2); n.ivl = Math.max(1, Math.round(s.ivl * 0.2)); n.lrn = true; n.due = now + 10 * MIN;
  } else {
    let iv;
    if (q === 1) { iv = Math.max(s.ivl + 1, Math.round(s.ivl * 1.2)); n.ease = Math.max(1.3, s.ease - 0.15); }
    else if (q === 2) { iv = Math.max(s.ivl + 1, Math.round(s.ivl * s.ease)); }
    else { iv = Math.max(s.ivl + 1, Math.round(s.ivl * s.ease * 1.3)); n.ease = s.ease + 0.15; }
    n.ivl = iv; n.reps = s.reps + 1; n.due = now + iv * DAY;
  }
  return n;
}
const isDue = (s, now, end) => (s.lrn ? s.due <= now + 20 * MIN : s.due <= end);
function fmtInt(ms) {
  if (ms < HOUR) return Math.max(1, Math.round(ms / MIN)) + ' min';
  if (ms < DAY) return Math.round(ms / HOUR) + ' h';
  const d = Math.round(ms / DAY);
  if (d < 30) return d + ' j';
  if (d < 365) return (d / 30).toFixed(1).replace('.0', '').replace('.', ',') + ' mois';
  return (d / 365).toFixed(1).replace('.0', '').replace('.', ',') + ' an';
}
const dirsOf = (d) => (d === 'a' ? ['a'] : d === 'b' ? ['b'] : ['a', 'b']);
const themeJa = (t) => (db.themeJa && db.themeJa[t]) || THEME_JA[norm(t)] || '';
const themeText = (t) => (themeJa(t) ? themeJa(t) + ' ' + t : t);
const toggleIn = (a, v) => { const i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); };
const filtered = (f) => db.cards.filter((c) => (!f.themes.length || f.themes.includes(c.theme)) && (!f.types.length || f.types.includes(c.type)));
function counts(f) {
  const now = Date.now(), end = endOfToday(); let due = 0, nw = 0;
  const cards = filtered(f);
  for (const c of cards) for (const d of dirsOf(f.dir)) {
    const s = c.srs[d];
    if (phase(s) === 'new') nw++; else if (isDue(s, now, end)) due++;
  }
  return { due, nw: Math.min(nw, db.settings.newPerSession), total: cards.length };
}
function buildQueue(f, all) {
  const now = Date.now(), end = endOfToday();
  const dues = [], news = [], others = [];
  for (const c of filtered(f)) for (const d of dirsOf(f.dir)) {
    const s = c.srs[d], item = { id: c.id, d };
    if (phase(s) === 'new') news.push(item); else if (isDue(s, now, end)) dues.push(item); else others.push(item);
  }
  if (all) return shuffle(dues.concat(news, others));
  return shuffle(dues).concat(shuffle(news).slice(0, db.settings.newPerSession));
}

  <ol style="margin:6px 0;padding-left:20px"><li>Copie la consigne.</li><li>Colle-la dans Claude, ChatGPT ou une autre IA.</li><li>Copie sa réponse (le bloc de code) et colle-la plus bas.</li><li>Appuie sur « Appliquer ».</li></ol>
  <textarea id="imgBox" readonly style="min-height:130px">${esc(prompt)}</textarea>
  <button class="sec" data-act="copyImg">${ja('コピー')}Copier la consigne</button>
  <label for="imgReply">${ja('AIの返答')}Réponse de l'IA</label>
  <textarea id="imgReply" placeholder="pomme ; りんご ; 🍎"></textarea>
  <button class="primary" data-act="applyImg">${ja('反映する')}Appliquer</button>
  <button class="link" data-act="closeModal">${ja('閉じる')}Fermer</button>`);
  copyText(prompt, 'Consigne copiée', '#imgBox');
}
function applyImgReply() {
  const text = $('#imgReply').value;
  if (!text.trim()) { toast('Colle d\'abord la réponse de l\'IA'); return; }
  const lines = text.replace(/^\ufeff/, '').split(/\r?\n/).filter((l) => !skipLine(l));
  const d = detectDelim(lines); let ok = 0, none = 0, unk = 0;
  for (const l of lines) {
    const p = splitLine(l, d);
    if (isHeader(p)) continue;
    if (p.length < 3) { unk++; continue; }
    const v = cleanImg(p[2]); if (!v) { none++; continue; }
    let c = db.cards.find((x) => keyOf(x.fr, x.jp) === keyOf(p[0], p[1]));
    if (!c) { const m = db.cards.filter((x) => norm(x.fr) === norm(p[0])); if (m.length === 1) c = m[0]; }
    if (!c) { unk++; continue; }
    if (!c.img) { c.img = v; ok++; }
  }
  save(); closeModal(); render();
  toast(`${ok} image(s) ajoutée(s)${none ? ', ' + none + ' mot(s) sans image' : ''}${unk ? ', ' + unk + ' ligne(s) non reconnue(s)' : ''}`);
}
function openThemeJa() {
  const rows = themes().map((t, i) => `<label for="tj${i}">${esc(t)}</label><input id="tj${i}" data-theme="${esc(t)}" lang="ja" autocomplete="off" value="${esc(themeJa(t))}" placeholder="例：食べ物">`).join('');
  openModal(`<h1>${ja('テーマの日本語名')}Noms japonais des thèmes</h1>
  <p class="hint">${ja('空欄のテーマは、日本語名なしで表示されます。')}Les noms les plus courants sont déjà connus. Écris ici le nom japonais des autres thèmes. Un champ vide revient au réglage automatique.</p>${rows}
  <button class="primary" data-act="saveThemeJa">${ja('保存')}Enregistrer</button>
  <button class="link" data-act="closeModal">${ja('キャンセル')}Annuler</button>`);
}
function saveThemeJa() {
  document.querySelectorAll('#modal input[data-theme]').forEach((inp) => {
    const t = inp.dataset.theme, v = inp.value.trim();
    if (v && v !== (THEME_JA[norm(t)] || '')) db.themeJa[t] = v; else delete db.themeJa[t];
  });
  save(); closeModal(); render(); toast('Enregistré');
}
function openEdit(id) {
  const c = byId(id); if (!c) return;
  openModal(`<h1>Modifier</h1><datalist id="themeList2">${themes().map((t) => `<option value="${esc(t)}">`).join('')}</datalist>
  <label for="eFr">Français</label><input id="eFr" value="${esc(c.fr)}">
  <label for="eJp">Japonais</label><input id="eJp" lang="ja" value="${esc(c.jp)}">
  <label for="eRd">Hiragana</label><input id="eRd" lang="ja" value="${esc(c.reading)}">
  <div class="row"><div><label for="eTheme">Thème</label><input id="eTheme" list="themeList2" value="${esc(c.theme)}"></div>
  <div><label for="eType">Type</label><select id="eType">${typeOpts(c.type)}</select></div></div>
  <label for="eNote">Note</label><input id="eNote" value="${esc(c.note)}">
  <label for="eImg">${ja('画像（絵文字）')}Image (emoji)</label><input id="eImg" value="${esc(c.img)}" placeholder="ex : 🍎">
  <p class="hint" style="margin:6px 0 0">${ja('スマホの絵文字キーボードで入力します（Windows：Windowsキー＋「.」）。')}Emoji du clavier du téléphone (Windows : touche Windows + point). Laisse vide s'il n'y a pas d'image évidente.</p>
  <button class="primary" data-act="saveEdit" data-id="${esc(id)}">Enregistrer</button>
  <button class="sec" data-act="resetProg" data-id="${esc(id)}">Remettre la progression à zéro</button>
  <button class="sec danger" data-act="delCard" data-id="${esc(id)}">Supprimer ce mot</button>
  <button class="link" data-act="closeModal">Annuler</button>`);
}
function saveEdit(id) {
  const c = byId(id); if (!c) return;
  const g = (x) => $('#' + x).value.trim();
  if (!g('eFr') || !g('eJp')) { toast('Le français et le japonais sont obligatoires'); return; }
  if (needsHira(g('eJp'), g('eRd'))) { toast('Ajoute le hiragana : le japonais contient des kanji'); return; }
  Object.assign(c, { fr: g('eFr'), jp: g('eJp'), reading: g('eRd'), theme: g('eTheme') || NO_THEME, type: g('eType'), note: g('eNote'), img: cleanImg(g('eImg')) });
  save(); closeModal(); render(); toast('Modifié');
}
const stamp = () => new Date().toISOString().slice(0, 10);
function download(name, text, mime) {
  try {
    const u = URL.createObjectURL(new Blob([text], { type: mime }));
    const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 3000); return true;
  } catch (e) { return false; }
}
function exportJson() {
  const text = JSON.stringify({ app: 'tango', version: 1, exported: new Date().toISOString(), settings: db.settings, themeJa: db.themeJa, cards: db.cards });
  $('#exportBox').value = text; download('tango-sauvegarde-' + stamp() + '.json', text, 'application/json');
  toast('Sauvegarde prête (fichier ou texte à copier)');
}
function exportCsv() {
  const cl = (s) => { const x = String(s || '').replace(/[\r\n\t]+/g, ' ').trim(); return /[;"]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
  const text = ['français;japonais;hiragana;thème;type;note;image'].concat(db.cards.map((c) => [c.fr, c.jp, c.reading, c.theme, c.type, c.note, c.img].map(cl).join(';'))).join('\n');
  $('#exportBox').value = text; download('tango-mots-' + stamp() + '.csv', '\ufeff' + text, 'text/csv');
  toast('Liste prête (fichier ou texte à copier)');
}
const TEMPLATE = 'français;japonais;hiragana;thème;type;note;image\n';
function exportTemplate() {
  const box = $('#exportBox'); if (box) box.value = TEMPLATE;
  const w = $('#tplWrap'); if (w) { w.hidden = false; $('#tplBox').value = TEMPLATE; }
  download('tango-modele-liste.csv', '\ufeff' + TEMPLATE, 'text/csv');
  toast('Modèle prêt (fichier ou texte à copier)');
}
function copyExport() {
  const box = $('#exportBox'); if (!box.value) { toast('Exporte d\'abord'); return; }
  const fallback = () => { box.select(); try { document.execCommand('copy'); toast('Copié'); } catch (e) { toast('Sélectionne le texte et copie-le à la main'); } };
  try { navigator.clipboard.writeText(box.value).then(() => toast('Copié')).catch(fallback); } catch (e) { fallback(); }
}
function importJson() {
  const text = $('#impBox').value.trim();
  if (!text) { toast('Colle une sauvegarde ou choisis un fichier'); return; }
  let o; try { o = JSON.parse(text); } catch (e) { toast('Ce contenu n\'est pas une sauvegarde valide'); return; }
  if (!o || !Array.isArray(o.cards)) { toast('Sauvegarde non reconnue'); return; }
  let n = 0;
  for (const raw of o.cards) {
    const c = sanitizeCard(raw); if (!c) continue;
    const i = db.cards.findIndex((x) => x.id === c.id);
    if (i >= 0) db.cards[i] = c; else db.cards.push(c);
    n++;
  }
  if (o.settings && typeof o.settings === 'object') Object.assign(db.settings, o.settings);
  if (o.themeJa && typeof o.themeJa === 'object') for (const k in o.themeJa) if (typeof o.themeJa[k] === 'string' && o.themeJa[k].trim()) db.themeJa[k] = o.themeJa[k].trim();
  save(); $('#impBox').value = ''; render(); toast(n + ' mot(s) restauré(s)');
}
async function xlsxToText(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), td = new TextDecoder();
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let k = 0; k < n; k++) {
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nl))] = { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) };
    p += 46 + nl + el + cl;
  }
  const read = async (name) => {
    const f = files[name]; if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return td.decode(data);
    return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  };
  const xml = (t) => new DOMParser().parseFromString(t, 'application/xml');
  const textOf = (el) => Array.from(el.getElementsByTagName('t')).map((t) => t.textContent).join('');
  const shared = [];
  const sst = await read('xl/sharedStrings.xml');
  if (sst) Array.from(xml(sst).getElementsByTagName('si')).forEach((si) => shared.push(textOf(si)));
  let sheetPath = 'xl/worksheets/sheet1.xml';
  try {
    const wb = xml(await read('xl/workbook.xml')), rels = xml(await read('xl/_rels/workbook.xml.rels'));
    const first = wb.getElementsByTagName('sheet')[0];
    const rid = first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id') || first.getAttribute('r:id');
    const rel = Array.from(rels.getElementsByTagName('Relationship')).find((r) => r.getAttribute('Id') === rid);
    if (rel) { const t = rel.getAttribute('Target').replace(/^\//, ''); sheetPath = t.startsWith('xl/') ? t : 'xl/' + t; }
  } catch (err) {}
  const sheet = await read(sheetPath);
  if (!sheet) throw new Error('feuille');
  const out = [];
  for (const row of Array.from(xml(sheet).getElementsByTagName('row'))) {
    const cells = [];
    for (const c of Array.from(row.getElementsByTagName('c'))) {
      const ref = (c.getAttribute('r') || '').replace(/[0-9]/g, ''); let col = 0;
      for (const ch of ref) col = col * 26 + (ch.charCodeAt(0) - 64);
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      let val = '';
      if (t === 's' && v) val = shared[Number(v.textContent)] || '';
      else if (t === 'inlineStr') val = textOf(c);
      else if (v) val = v.textContent;
      cells[(col || cells.length + 1) - 1] = String(val).replace(/[\t\r\n]+/g, ' ').trim();
    }
    const line = Array.from(cells, (x) => x || '').join('\t');
    if (line.replace(/\t/g, '').trim()) out.push(line);
  }
  return out.join('\n');
}
async function loadXlsx(f) {
  try {
    const t = await xlsxToText(await f.arrayBuffer());
    const n = t.split('\n').filter((l) => l.trim()).length;
    $('#bText').value = t;
    toast(n > 1 ? 'Fichier Excel chargé : ' + (n - 1) + ' ligne(s)' : 'Le fichier ne contient aucun mot sous la ligne de titres');
  } catch (err) { toast('Fichier Excel illisible : enregistre-le au format .xlsx ou en CSV UTF-8'); }
}
function readFileInto(input, target) {
  const f = input.files && input.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { const t = String(r.result).replace(/^\ufeff/, ''); $(target).value = t; toast(t.includes('\ufffd') ? 'Fichier mal encodé : enregistre-le en « CSV UTF-8 »' : 'Fichier chargé'); }; r.readAsText(f);
}

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'tab': tab = el.dataset.tab; window.scrollTo(0, 0); render(); break;
    case 'dir': db.ui.dir = el.dataset.dir; save(); render(); break;
    case 'toggleTheme': toggleIn(db.ui.themes, el.dataset.theme); save(); render(); break;
    case 'toggleType': toggleIn(db.ui.types, el.dataset.type); save(); render(); break;
    case 'clearFilters': db.ui.themes = []; db.ui.types = []; save(); render(); break;
    case 'start': startSession(false); break;
    case 'startAll': startSession(true); break;
    case 'quit': endSession(); break;
    case 'reveal': if (session) { session.revealed = true; renderStudy(); } break;
    case 'rate': rate(Number(el.dataset.q)); break;
    case 'speak': speak(el.dataset.text, el.dataset.lang); break;
    case 'addOne': addOne(); break;
    case 'addBatch': addBatch(); break;
    case 'edit': openEdit(el.dataset.id); break;
    case 'saveEdit': saveEdit(el.dataset.id); break;
    case 'resetProg': { const c = byId(el.dataset.id); if (c) { c.srs = { a: srsNew(), b: srsNew() }; save(); closeModal(); render(); toast('Progression remise à zéro'); } break; }
    case 'delCard': { const ok = await confirmDialog('Supprimer définitivement ce mot ?', 'Supprimer', 'この単語を完全に削除しますか？', '削除'); if (ok) { db.cards = db.cards.filter((c) => c.id !== el.dataset.id); save(); closeModal(); render(); toast('Supprimé'); } break; }
    case 'closeModal': closeModal(); break;
    case 'dlg-yes': closeModal(); if (confirmDialog.resolve) confirmDialog.resolve(true); break;
    case 'dlg-no': closeModal(); if (confirmDialog.resolve) confirmDialog.resolve(false); break;
    case 'starter': { const r = addMany(STARTER.map(([fr, jp, reading, theme, type]) => ({ fr, jp, reading, theme, type }))); render(); toast(r.added + ' mot(s) ajouté(s)'); break; }
    case 'reset': { const ok = await confirmDialog('Effacer tous les mots et toute la progression ? Pense à faire une sauvegarde avant.', 'Tout effacer', 'すべての単語と学習記録を削除しますか？先にバックアップを取ってください。', 'すべて削除'); if (ok) { db = defaults(); save(); render(); toast('Tout est effacé'); } break; }
    case 'exportJson': exportJson(); break;
    case 'exportCsv': exportCsv(); break;
    case 'exportTemplate': exportTemplate(); break;
    case 'aiPrompt': aiPrompt(); break;
    case 'imgPrompt': openImgPrompt(); break;
    case 'exportImg': openExportImg(); break;
    case 'expXlsx': exportImgFile('xlsx'); break;
    case 'expCsv': exportImgFile('csv'); break;
    case 'copyXbox': copyText($('#xBox').value, 'Copié', '#xBox'); break;
    case 'themeJa': openThemeJa(); break;
    case 'saveThemeJa': saveThemeJa(); break;
    case 'copyImg': copyText($('#imgBox').value, 'Consigne copiée', '#imgBox'); break;
    case 'applyImg': applyImgReply(); break;
    case 'copyAi': copyText($('#aiBox').value, 'Consigne copiée', '#aiBox'); break;
    case 'copyTpl': copyText($('#tplBox').value, 'Modèle copié', '#tplBox'); break;
    case 'copyExport': copyExport(); break;
    case 'importJson': importJson(); break;
    case 'install': if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; render(); } break;
  }
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'libTheme') { libState.theme = e.target.value; renderLibList(); }
  else if (id === 'libType') { libState.type = e.target.value; renderLibList(); }
  else if (id === 'sNew') { db.settings.newPerSession = Math.max(1, Math.min(200, num(e.target.value, 10))); save(); }
  else if (id === 'sRomaji') { db.settings.romaji = e.target.checked; save(); }
  else if (id === 'sRead') { db.settings.readingFront = e.target.checked; save(); }
  else if (id === 'sImg') { db.settings.images = e.target.checked; save(); }
  else if (id === 'sImgFront') { db.settings.imageFront = e.target.checked; save(); }
  else if (id === 'bFile') { const f = e.target.files && e.target.files[0]; if (f && /\.xlsx$/i.test(f.name)) loadXlsx(f); else if (f && /\.xls$/i.test(f.name)) toast('Ancien format .xls non géré : enregistre en .xlsx ou en CSV UTF-8'); else readFileInto(e.target, '#bText'); }
  else if (id === 'impFile') readFileInto(e.target, '#impBox');
});
document.addEventListener('input', (e) => { if (e.target.id === 'libQ') { libState.q = e.target.value; renderLibList(); } });
document.addEventListener('keydown', (e) => {
  if (!session || !$('#modal').hidden) return;
  if (!session.revealed && (e.key === ' ' || e.key === 'Enter') && session.queue.length) { e.preventDefault(); session.revealed = true; renderStudy(); }
  else if (session.revealed && /^[1-4]$/.test(e.key)) rate(Number(e.key) - 1);
});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (tab === 'more') render(); });

/* ---------- Démarrage ---------- */
render();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !isPreview) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__tango = { get db() { return db; }, romaji, schedule };
})();
